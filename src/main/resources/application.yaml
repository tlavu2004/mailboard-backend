spring:
  application:
    name: MailBoard
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mailboard}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 10000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 0
    repair-on-migrate: true
    validate-on-migrate: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native
  error:
    include-message: always
    include-binding-errors: always

jwt:
    secret: ${JWT_SECRET:dummy-secret-at-least-32-chars-long-for-hs256}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:86400000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
    issuer: email-client-ai
    header: Authorization
    prefix: "Bearer "

google:
  oauth:
    enabled: true
    client-id: ${GOOGLE_CLIENT_ID:dummy-id}
    client-secret: ${GOOGLE_CLIENT_SECRET:dummy-secret}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

encryption:
  aes-secret-key: ${ENCRYPTION_AES_KEY:dummy-key-16-chs}

cors:
  allowed-origins:
    - ${CORS_ALLOWED_ORIGIN_1:http://localhost}
    - ${CORS_ALLOWED_ORIGIN_2:http://localhost:3000}
    - ${CORS_ALLOWED_ORIGIN_3:http://localhost:5173}
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
    - OPTIONS
  allowed-headers:
    - "*"
  exposed-headers:
    - Authorization
  allow-credentials: true
  max-age: 3600

gemini:
  api-key: ${GEMINI_API_KEY:}
  embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
  chat-model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}

gmail:
  pubsub:
    topic: ${GMAIL_PUBSUB_TOPIC:projects/email-client-ai-oauth/topics/gmail-notifications}
  embedding:
    local:
      enabled: ${APP_EMBEDDING_LOCAL_ENABLED:true}
app:
  mail:
    sync:
      batch-size: ${MAIL_SYNC_BATCH_SIZE:20}


logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

---

# Development Profile
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    com.awad.emailclientai: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: INFO
  # file:
  #   name: /app/logs/mailboard.log

---

# Production Profile
spring:
  config:
    activate:
      on-profile: prod
logging:
  level:
    com.awad.emailclientai: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
app:
  embedding:
    local:
      enabled: false
