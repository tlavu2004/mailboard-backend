spring:
  application:
    name: Email Client AI

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mailboard}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 10000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 0

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

jwt:
    secret: ${JWT_SECRET:defaultSecretKeyForTestingOnly1234567890!}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
    issuer: email-client-ai
    header: Authorization
    prefix: "Bearer "

google:
  oauth:
    enabled: true
    client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
    client-secret: ${GOOGLE_CLIENT_SECRET:dummy-client-secret}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

# Encryption Configuration (for secure credential storage - GA04)
encryption:
  aes-secret-key: ${ENCRYPTION_AES_KEY:DefaultSecretKeyForDev1234567890!}

# CORS Configuration
cors:
  allowed-origins:
    - ${CORS_ALLOWED_ORIGIN_1}
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
    - OPTIONS
  allowed-headers:
    - "*"
  exposed-headers:
    - Authorization
  allow-credentials: true
  max-age: 3600

logging:
  level:
    com.awad.emailclientai: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.zaxxer.hikari: DEBUG
    com.zaxxer.hikari.HikariConfig: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

gemini:
  api-key: ${GEMINI_API_KEY:dummy-api-key}
  embedding-model: ${GEMINI_EMBEDDING_MODEL:embedding-001}
  chat-model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}
