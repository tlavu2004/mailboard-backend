name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/*'
      - 'fix/*'
      - 'refactor/*'
      - 'test/*'
      - 'chore/*'
      - 'ci/*'
      - 'docs/*'
      - 'style/*'
      - 'perf/*'
      - 'build/*'
      - 'release/*'
      - 'hotfix/*'
      - 'wip/*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mailboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven
        run: mvn -B clean verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/mailboard_test
          DB_USERNAME: postgres
          DB_PASSWORD: password
          JWT_SECRET: "test_secret_key_at_least_32_bytes_long_for_ci_build"
          JWT_ACCESS_EXPIRATION: 3600000
          JWT_REFRESH_EXPIRATION: 86400000
          GOOGLE_CLIENT_ID: "mock_client_id"
          GOOGLE_CLIENT_SECRET: "mock_client_secret"
          GOOGLE_REDIRECT_URI: "http://localhost:8080"
          CORS_ALLOWED_ORIGIN_1: "*"
          GEMINI_API_KEY: "mock_api_key"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max