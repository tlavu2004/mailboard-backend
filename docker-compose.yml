services:
  mailboard-backend:
    build: .
    container_name: mailboard-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    env_file:
      - .env
    depends_on:
      - db

  ngrok:
    image: ngrok/ngrok:latest
    container_name: mailboard-ngrok
    ports:
      - "4040:4040"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: "http mailboard-backend:8080"
    depends_on:
      - mailboard-backend
    env_file:
      - .env

  db:
      image: pgvector/pgvector:pg16
      container_name: mailboard-db
      environment:
        POSTGRES_USER: ${DB_USERNAME:-postgres}
        POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
        POSTGRES_DB: mailboard
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
